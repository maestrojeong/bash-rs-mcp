name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: bash-rs-macos-arm64
          # Both Linux assets link musl statically. The gnu builds inherited the
          # runner's glibc — 2.39 on ubuntu-24.04 — so the binary refused to
          # start on anything older, Debian bookworm included, which is what
          # most container images still are. A static binary has no such floor,
          # and this crate is pure Rust apart from `libc`, so nothing is lost.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: bash-rs-linux-x64
          # Linux on arm64 is not a niche: it is what an Apple Silicon machine
          # runs containers as, and what the cheaper cloud instances are.
          # Without this asset the installer declines there and background_bash
          # is simply missing. A native runner is free on a public repo, so no
          # cross-compilation is involved.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: bash-rs-linux-arm64
          # Windows runs the commands through Git for Windows' bash, which
          # shares this machine's filesystem and PATH — see `bash_program()`.
          # There is no static-linking concern here: the MSVC target has no
          # glibc floor to inherit.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: bash-rs-windows-x64.exe
            bin_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    # `cp` and the POSIX test syntax below are bash, which the Windows
    # runner does not use by default.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Verify release tag matches package version
        run: |
          version="$(cargo pkgid -p bashrs-mcp | sed -E 's/.*[#@]//')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "release tag ${GITHUB_REF_NAME} does not match bashrs-mcp version v${version}" >&2
            exit 1
          }

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p bashrs-mcp

      # A musl target that quietly links dynamically would reintroduce the
      # glibc floor without anyone noticing until the binary failed to start on
      # someone's machine. Fail the release instead.
      - name: Verify the Linux binary is static
        if: endsWith(matrix.target, '-musl')
        run: |
          binary="target/${{ matrix.target }}/release/bash-rs"
          file "$binary"
          if readelf -d "$binary" | grep -q NEEDED; then
            echo "expected a static binary, but it has dynamic dependencies:" >&2
            readelf -d "$binary" | grep NEEDED >&2
            exit 1
          fi

      - name: Package
        run: |
          cp "target/${{ matrix.target }}/release/bash-rs${{ matrix.bin_suffix }}" "${{ matrix.asset }}"
          # `shasum` is a Perl script and the Windows runner's Git Bash ships
          # without Perl; `sha256sum` is a coreutils binary and is missing from
          # a stock macOS. Both print the same "<hash>  <name>" line, so take
          # whichever the runner has.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
